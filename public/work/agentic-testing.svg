<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Testing Suite</title>
  <desc id="desc">Diagram of a self-maintaining browser test platform that uses AI to discover test cases, runs Playwright end-to-end suites, auto-heals broken selectors, and enforces quality gates with regression reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="54%" stop-color="#F2F7FB"/>
      <stop offset="100%" stop-color="#EEF6F1"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123B5D"/>
      <stop offset="58%" stop-color="#225E73"/>
      <stop offset="100%" stop-color="#2F6F54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102A43" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35657A"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D7A55"/>
    </marker>
    <style>
      .page { fill: url(#bg); }
      .header { fill: url(#header); }
      .title { font: 700 44px Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #DDEBF2; }
      .meta { font: 400 14px Arial, sans-serif; fill: #DDEBF2; }
      .phaseLabel { font: 700 18px Arial, sans-serif; fill: #1F4E79; letter-spacing: 0.4px; }
      .phaseRule { stroke: #9DB6C8; stroke-width: 2; }
      .card { fill: #FFFFFF; stroke: #CAD8E3; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .cardBlue { fill: #F5FAFE; stroke: #B8D0E0; }
      .cardGreen { fill: #F4FBF6; stroke: #B8DCC5; }
      .cardGold { fill: #FFF9EA; stroke: #E5C875; }
      .num { font: 700 14px Arial, sans-serif; fill: #FFFFFF; }
      .numCircle { fill: #1F4E79; }
      .numCircleGreen { fill: #2D7A55; }
      .numCircleGold { fill: #9A6B00; }
      .h { font: 700 19px Arial, sans-serif; fill: #183B56; }
      .hsm { font: 700 16px Arial, sans-serif; fill: #183B56; }
      .body { font: 400 14px Arial, sans-serif; fill: #334E68; }
      .small { font: 400 12.5px Arial, sans-serif; fill: #536B7B; }
      .pill { fill: #E9F2F8; stroke: #B8D0E0; stroke-width: 1; rx: 13; }
      .pillGreen { fill: #E9F7EE; stroke: #B8DCC5; }
      .pillText { font: 700 12.5px Arial, sans-serif; fill: #27485B; }
      .arrow { fill: none; stroke: #35657A; stroke-width: 3; marker-end: url(#arrow); }
      .arrowGreen { fill: none; stroke: #2D7A55; stroke-width: 3; marker-end: url(#arrowGreen); }
      .band { fill: #17324D; rx: 18; filter: url(#shadow); }
      .bandTitle { font: 700 19px Arial, sans-serif; fill: #FFFFFF; }
      .bandText { font: 400 14px Arial, sans-serif; fill: #DDEBF2; }
      .chip { fill: #21496B; rx: 13; }
      .chipText { font: 700 13px Arial, sans-serif; fill: #EAF3FA; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="1050"/>
  <rect class="header" x="0" y="0" width="1600" height="150"/>
  <text class="title" x="70" y="72">Agentic Testing Suite</text>
  <text class="subtitle" x="72" y="110">A self-maintaining QA platform: AI discovers test cases, Playwright runs them, daemons heal broken selectors and grow coverage, and quality gates guard every release.</text>
  <text class="meta" x="1300" y="58">Portfolio artifact</text>
  <text class="meta" x="1300" y="84">Playwright / PostgreSQL</text>

  <!-- Phase labels -->
  <text class="phaseLabel" x="70" y="193">1. Discover &amp; Plan</text>
  <line class="phaseRule" x1="70" y1="206" x2="510" y2="206"/>
  <text class="phaseLabel" x="580" y="193">2. Run &amp; Heal</text>
  <line class="phaseRule" x1="580" y1="206" x2="1020" y2="206"/>
  <text class="phaseLabel" x="1090" y="193">3. Gate &amp; Report</text>
  <line class="phaseRule" x1="1090" y1="206" x2="1530" y2="206"/>

  <!-- Row 1: left to right -->
  <g transform="translate(70,220)">
    <rect class="card cardGreen" width="440" height="150"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">1</text>
    <text class="h" x="56" y="36">Agentic Discovery</text>
    <text class="body" x="22" y="72">OpenAI GPT-5.2 (default) or Claude</text>
    <text class="body" x="22" y="94">autonomously explores the app and</text>
    <text class="body" x="22" y="116">proposes test cases for flows no</text>
    <text class="body" x="22" y="138">one wrote by hand.</text>
  </g>
  <path class="arrow" d="M 510 295 C 532 295, 548 295, 578 295"/>
  <g transform="translate(580,220)">
    <rect class="card" width="440" height="150"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">2</text>
    <text class="h" x="56" y="36">Coverage Policy Daemon</text>
    <text class="body" x="22" y="72">Produces a daily gaps-and-parity</text>
    <text class="body" x="22" y="94">digest and auto-generates draft</text>
    <text class="body" x="22" y="116">test plans for the surfaces that</text>
    <text class="body" x="22" y="138">lack coverage.</text>
  </g>
  <path class="arrow" d="M 1020 295 C 1042 295, 1058 295, 1088 295"/>
  <g transform="translate(1090,220)">
    <rect class="card cardGreen" width="440" height="150"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">3</text>
    <text class="h" x="56" y="36">Auto-Promotion Daemon</text>
    <text class="body" x="22" y="72">Validates draft plans by actually</text>
    <text class="body" x="22" y="94">running them, then auto-enables</text>
    <text class="body" x="22" y="116">the cases that pass &#8212; no manual</text>
    <text class="body" x="22" y="138">triage needed.</text>
  </g>

  <path class="arrowGreen" d="M 1310 370 C 1310 384, 1310 390, 1310 398"/>

  <!-- Row 2: right to left -->
  <g transform="translate(1090,400)">
    <rect class="card cardBlue" width="440" height="150"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">4</text>
    <text class="h" x="56" y="36">Playwright E2E</text>
    <text class="body" x="22" y="66">Headless browser runs across three</text>
    <text class="body" x="22" y="88">projects:</text>
    <rect class="pill" x="22" y="98" width="184" height="28"/><text class="pillText" x="38" y="117">datawizard-smoke</text>
    <rect class="pill" x="214" y="98" width="160" height="28"/><text class="pillText" x="230" y="117">legacy-imports</text>
    <rect class="pill" x="22" y="132" width="220" height="28"/><text class="pillText" x="38" y="151">testing-suite-staging</text>
  </g>
  <path class="arrow" d="M 1090 475 C 1068 475, 1052 475, 1022 475"/>
  <g transform="translate(580,400)">
    <rect class="card" width="440" height="150"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">5</text>
    <text class="h" x="56" y="36">Accessibility Checks</text>
    <text class="body" x="22" y="72">Axe-core runs alongside functional</text>
    <text class="body" x="22" y="94">tests with configurable fail-or-</text>
    <text class="body" x="22" y="116">report modes, catching a11y</text>
    <text class="body" x="22" y="138">regressions early.</text>
  </g>
  <path class="arrowGreen" d="M 580 475 C 558 475, 542 475, 512 475"/>
  <g transform="translate(70,400)">
    <rect class="card cardGreen" width="440" height="150"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">6</text>
    <text class="h" x="56" y="36">Self-Heal Daemon</text>
    <text class="body" x="22" y="72">When a selector breaks, it proposes</text>
    <text class="body" x="22" y="94">and auto-applies a CSS fix, so UI</text>
    <text class="body" x="22" y="116">churn doesn't turn into a backlog</text>
    <text class="body" x="22" y="138">of false failures.</text>
  </g>

  <path class="arrowGreen" d="M 290 550 C 290 564, 290 570, 290 578"/>

  <!-- Row 3: left to right -->
  <g transform="translate(70,580)">
    <rect class="card cardGold" width="440" height="150"/>
    <circle class="numCircleGold" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">7</text>
    <text class="h" x="56" y="36">Quality Gates</text>
    <text class="body" x="22" y="72">Regression digest, flakiness</text>
    <text class="body" x="22" y="94">detection, and run triage group</text>
    <text class="body" x="22" y="116">failures by root cause before</text>
    <text class="body" x="22" y="138">anything ships.</text>
  </g>
  <path class="arrow" d="M 510 655 C 532 655, 548 655, 578 655"/>
  <g transform="translate(580,580)">
    <rect class="card cardBlue" width="440" height="150"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">8</text>
    <text class="h" x="56" y="36">Artifact Capture</text>
    <text class="body" x="22" y="68">On failure, captures evidence:</text>
    <rect class="pill" x="22" y="80" width="110" height="28"/><text class="pillText" x="38" y="99">traces</text>
    <rect class="pill" x="140" y="80" width="110" height="28"/><text class="pillText" x="156" y="99">videos</text>
    <rect class="pill" x="258" y="80" width="150" height="28"/><text class="pillText" x="274" y="99">screenshots</text>
    <text class="small" x="22" y="132">Configurable: always, on-failure, or never.</text>
  </g>
  <path class="arrow" d="M 1020 655 C 1042 655, 1058 655, 1088 655"/>
  <g transform="translate(1090,580)">
    <rect class="card cardGreen" width="440" height="150"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">9</text>
    <text class="h" x="56" y="36">Regression Reports</text>
    <text class="body" x="22" y="72">Emails a digest of test failures and</text>
    <text class="body" x="22" y="94">coverage gaps, closing the loop</text>
    <text class="body" x="22" y="116">back to the discovery and policy</text>
    <text class="body" x="22" y="138">daemons.</text>
  </g>

  <!-- Bottom band -->
  <g transform="translate(70,762)">
    <rect class="band" width="820" height="160"/>
    <text class="bandTitle" x="28" y="42">PostgreSQL test registry</text>
    <text class="bandText" x="28" y="78">A single source of truth stores QA specs, run plans, evidence, and</text>
    <text class="bandText" x="28" y="102">regression digests. Worker and run concurrency are capped globally</text>
    <text class="bandText" x="28" y="126">to keep parallel suites from exhausting memory.</text>
  </g>
  <g transform="translate(910,762)">
    <rect class="card cardBlue" width="620" height="160"/>
    <text class="hsm" x="24" y="40">What it covers</text>
    <rect class="pill" x="24" y="56" width="200" height="32"/><text class="pillText" x="40" y="77">Import workflows</text>
    <rect class="pill" x="234" y="56" width="160" height="32"/><text class="pillText" x="250" y="77">Field mapping</text>
    <rect class="pill" x="404" y="56" width="190" height="32"/><text class="pillText" x="420" y="77">Approval / execute</text>
    <rect class="pill" x="24" y="98" width="120" height="32"/><text class="pillText" x="40" y="119">Actions</text>
    <rect class="pill" x="154" y="98" width="270" height="32"/><text class="pillText" x="170" y="119">Mirabel Connect API surface</text>
    <text class="small" x="24" y="150">Contacts, Orders, Subscriptions, Opportunities, and Notes flows.</text>
  </g>
</svg>
