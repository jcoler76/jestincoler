<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Mirabel VideoGen Pipeline</title>
  <desc id="desc">Diagram of an automated pipeline that turns live application pages into recorded product walkthroughs, help articles, and knowledge-base content using Playwright, LLM-assisted selector discovery, grounded scripts, and text-to-speech.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="54%" stop-color="#F2F7FB"/>
      <stop offset="100%" stop-color="#EEF6F1"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123B5D"/>
      <stop offset="58%" stop-color="#225E73"/>
      <stop offset="100%" stop-color="#2F6F54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102A43" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35657A"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D7A55"/>
    </marker>
    <style>
      .page { fill: url(#bg); }
      .header { fill: url(#header); }
      .title { font: 700 44px Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #DDEBF2; }
      .meta { font: 400 14px Arial, sans-serif; fill: #DDEBF2; }
      .phaseLabel { font: 700 18px Arial, sans-serif; fill: #1F4E79; letter-spacing: 0.4px; }
      .phaseRule { stroke: #9DB6C8; stroke-width: 2; }
      .card { fill: #FFFFFF; stroke: #CAD8E3; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .cardBlue { fill: #F5FAFE; stroke: #B8D0E0; }
      .cardGreen { fill: #F4FBF6; stroke: #B8DCC5; }
      .cardGold { fill: #FFF9EA; stroke: #E5C875; }
      .num { font: 700 14px Arial, sans-serif; fill: #FFFFFF; }
      .numCircle { fill: #1F4E79; }
      .numCircleGreen { fill: #2D7A55; }
      .numCircleGold { fill: #9A6B00; }
      .h { font: 700 19px Arial, sans-serif; fill: #183B56; }
      .hsm { font: 700 16px Arial, sans-serif; fill: #183B56; }
      .body { font: 400 14px Arial, sans-serif; fill: #334E68; }
      .small { font: 400 12.5px Arial, sans-serif; fill: #536B7B; }
      .pill { fill: #E9F2F8; stroke: #B8D0E0; stroke-width: 1; rx: 13; }
      .pillGreen { fill: #E9F7EE; stroke: #B8DCC5; }
      .pillText { font: 700 12.5px Arial, sans-serif; fill: #27485B; }
      .arrow { fill: none; stroke: #35657A; stroke-width: 3; marker-end: url(#arrow); }
      .arrowGreen { fill: none; stroke: #2D7A55; stroke-width: 3; marker-end: url(#arrowGreen); }
      .band { fill: #17324D; rx: 18; filter: url(#shadow); }
      .bandTitle { font: 700 19px Arial, sans-serif; fill: #FFFFFF; }
      .bandText { font: 400 14px Arial, sans-serif; fill: #DDEBF2; }
      .chip { fill: #21496B; rx: 13; }
      .chipText { font: 700 13px Arial, sans-serif; fill: #EAF3FA; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="1050"/>
  <rect class="header" x="0" y="0" width="1600" height="150"/>
  <text class="title" x="70" y="72">Mirabel VideoGen: Page-to-Walkthrough Pipeline</text>
  <text class="subtitle" x="72" y="110">Turns a live application page into a narrated MP4 walkthrough, a help-center article, and knowledge-base content &#8212; from one declarative run.</text>
  <text class="meta" x="1300" y="58">Portfolio artifact</text>
  <text class="meta" x="1300" y="84">Playwright / OpenAI / ffmpeg</text>

  <!-- Phase labels -->
  <text class="phaseLabel" x="70" y="193">1. Capture &amp; Learn</text>
  <line class="phaseRule" x1="70" y1="206" x2="510" y2="206"/>
  <text class="phaseLabel" x="580" y="193">2. Script &amp; Voice</text>
  <line class="phaseRule" x1="580" y1="206" x2="1020" y2="206"/>
  <text class="phaseLabel" x="1090" y="193">3. Compose &amp; Publish</text>
  <line class="phaseRule" x1="1090" y1="206" x2="1530" y2="206"/>

  <!-- Row 1: left to right -->
  <g transform="translate(70,220)">
    <rect class="card cardBlue" width="440" height="150"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">1</text>
    <text class="h" x="56" y="36">Target Page</text>
    <text class="body" x="22" y="72">A page URL is submitted from</text>
    <text class="body" x="22" y="94">the Preflight training-assets UI,</text>
    <text class="body" x="22" y="116">picking up internal credentials</text>
    <text class="body" x="22" y="138">on the EC2 job runner.</text>
  </g>
  <path class="arrow" d="M 510 295 C 532 295, 548 295, 578 295"/>
  <g transform="translate(580,220)">
    <rect class="card" width="440" height="150"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">2</text>
    <text class="h" x="56" y="36">Scene Recording</text>
    <text class="body" x="22" y="72">A declarative scene runner drives</text>
    <text class="body" x="22" y="94">Playwright through clicks, fills,</text>
    <text class="body" x="22" y="116">and scrolls &#8212; smartNav and live</text>
    <text class="body" x="22" y="138">DOM bootstrap find the path.</text>
  </g>
  <path class="arrow" d="M 1020 295 C 1042 295, 1058 295, 1088 295"/>
  <g transform="translate(1090,220)">
    <rect class="card cardGreen" width="440" height="150"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">3</text>
    <text class="h" x="56" y="36">Selector Learning v1&#8211;v3</text>
    <text class="body" x="22" y="72">Heuristics &#8594; DOM-snapshot LLM</text>
    <text class="body" x="22" y="94">proposal &#8594; source-aware JSX</text>
    <text class="body" x="22" y="116">extraction resolve UI targets</text>
    <text class="body" x="22" y="138">across React forms.</text>
  </g>

  <!-- 3 -> 4 down -->
  <path class="arrowGreen" d="M 1310 370 C 1310 384, 1310 390, 1310 398"/>

  <!-- Row 2: right to left -->
  <g transform="translate(1090,400)">
    <rect class="card cardGreen" width="440" height="150"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">4</text>
    <text class="h" x="56" y="36">Grounded Script</text>
    <text class="body" x="22" y="72">An LLM writes narration constrained</text>
    <text class="body" x="22" y="94">to knowledge-base chunks, falling</text>
    <text class="body" x="22" y="116">back to INSUFFICIENT_KB rather</text>
    <text class="body" x="22" y="138">than inventing claims.</text>
  </g>
  <path class="arrow" d="M 1090 475 C 1068 475, 1052 475, 1022 475"/>
  <g transform="translate(580,400)">
    <rect class="card" width="440" height="150"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">5</text>
    <text class="h" x="56" y="36">Text-to-Speech</text>
    <text class="body" x="22" y="72">Pluggable TTS: OpenAI voices</text>
    <text class="body" x="22" y="94">(default nova) or ElevenLabs</text>
    <text class="body" x="22" y="116">cloned voices with tunable</text>
    <text class="body" x="22" y="138">stability and style.</text>
  </g>
  <path class="arrow" d="M 580 475 C 558 475, 542 475, 512 475"/>
  <g transform="translate(70,400)">
    <rect class="card cardGold" width="440" height="150"/>
    <circle class="numCircleGold" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">6</text>
    <text class="h" x="56" y="36">Beat Timing</text>
    <text class="body" x="22" y="72">ffprobe measures each narration</text>
    <text class="body" x="22" y="94">segment; scene waits are paired</text>
    <text class="body" x="22" y="116">to audio so video and voice stay</text>
    <text class="body" x="22" y="138">in sync without re-recording.</text>
  </g>

  <!-- 6 -> 7 down -->
  <path class="arrowGreen" d="M 290 550 C 290 564, 290 570, 290 578"/>

  <!-- Row 3: left to right -->
  <g transform="translate(70,580)">
    <rect class="card cardGreen" width="440" height="150"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">7</text>
    <text class="h" x="56" y="36">Trim &amp; Compose</text>
    <text class="body" x="22" y="72">Trim-mode muxing cuts dead air</text>
    <text class="body" x="22" y="94">after each beat; an ffmpeg concat</text>
    <text class="body" x="22" y="116">demuxer produces the final MP4</text>
    <text class="body" x="22" y="138">with no re-encode.</text>
  </g>
  <path class="arrow" d="M 510 655 C 532 655, 548 655, 578 655"/>
  <g transform="translate(580,580)">
    <rect class="card cardBlue" width="440" height="150"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">8</text>
    <text class="h" x="56" y="36">Multi-Output</text>
    <text class="body" x="22" y="68">One run yields four artifacts:</text>
    <rect class="pill" x="22" y="80" width="150" height="28"/><text class="pillText" x="38" y="99">MP4 walkthrough</text>
    <rect class="pill" x="180" y="80" width="172" height="28"/><text class="pillText" x="196" y="99">consulting Markdown</text>
    <rect class="pill" x="22" y="114" width="178" height="28"/><text class="pillText" x="38" y="133">Help Center HTML</text>
    <rect class="pill pillGreen" x="208" y="114" width="124" height="28"/><text class="pillText" x="224" y="133">KB chunks</text>
  </g>
  <path class="arrow" d="M 1020 655 C 1042 655, 1058 655, 1088 655"/>
  <g transform="translate(1090,580)">
    <rect class="card cardGold" width="440" height="150"/>
    <circle class="numCircleGold" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">9</text>
    <text class="h" x="56" y="36">Validation</text>
    <text class="body" x="22" y="72">An anchor validator dry-runs the</text>
    <text class="body" x="22" y="94">scene walk without TTS or video to</text>
    <text class="body" x="22" y="116">catch drift; partial-accept drops</text>
    <text class="body" x="22" y="138">bad scenes and keeps the good.</text>
  </g>

  <!-- Bottom bands -->
  <g transform="translate(70,762)">
    <rect class="band" width="820" height="160"/>
    <text class="bandTitle" x="28" y="42">Page anchors feed the knowledge base</text>
    <text class="bandText" x="28" y="78">Each run persists a reusable Page Anchor (selectors, scenes, narrative,</text>
    <text class="bandText" x="28" y="102">workflow steps) and upserts it as source_type = 'page-anchor' into</text>
    <text class="bandText" x="28" y="126">mirabel-knowledge-base &#8212; powering chatbots, ticket assistants, and agents.</text>
  </g>
  <g transform="translate(910,762)">
    <rect class="card cardBlue" width="620" height="160"/>
    <text class="hsm" x="24" y="40">External services</text>
    <rect class="pill" x="24" y="56" width="290" height="32"/><text class="pillText" x="40" y="77">OpenAI &#183; gpt-4o-mini, gpt-4, tts-1</text>
    <rect class="pill" x="324" y="56" width="180" height="32"/><text class="pillText" x="340" y="77">ElevenLabs voices</text>
    <rect class="pill" x="24" y="98" width="150" height="32"/><text class="pillText" x="40" y="119">HeyGen avatars</text>
    <rect class="pill" x="184" y="98" width="130" height="32"/><text class="pillText" x="200" y="119">Playwright</text>
    <rect class="pill" x="324" y="98" width="180" height="32"/><text class="pillText" x="340" y="119">ffmpeg / ffprobe</text>
    <text class="small" x="24" y="150">EC2 CLI job runner &#183; invoked by Preflight, source-aware from mirrored UI repos.</text>
  </g>
</svg>
