<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Mirabel API Platform</title>
  <desc id="desc">Diagram of an API management and workflow-automation platform: a request path from consumers through auth and a REST/GraphQL layer to a hybrid MongoDB and SQL Server data tier, plus six platform capability areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="54%" stop-color="#F2F7FB"/>
      <stop offset="100%" stop-color="#EEF6F1"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123B5D"/>
      <stop offset="58%" stop-color="#225E73"/>
      <stop offset="100%" stop-color="#2F6F54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102A43" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9EC7DA"/>
    </marker>
    <style>
      .page { fill: url(#bg); }
      .header { fill: url(#header); }
      .title { font: 700 44px Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #DDEBF2; }
      .meta { font: 400 14px Arial, sans-serif; fill: #DDEBF2; }
      .phaseLabel { font: 700 18px Arial, sans-serif; fill: #1F4E79; letter-spacing: 0.4px; }
      .phaseRule { stroke: #9DB6C8; stroke-width: 2; }
      .card { fill: #FFFFFF; stroke: #CAD8E3; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .cardBlue { fill: #F5FAFE; stroke: #B8D0E0; }
      .cardGreen { fill: #F4FBF6; stroke: #B8DCC5; }
      .cardGold { fill: #FFF9EA; stroke: #E5C875; }
      .num { font: 700 14px Arial, sans-serif; fill: #FFFFFF; }
      .numCircle { fill: #1F4E79; }
      .numCircleGreen { fill: #2D7A55; }
      .numCircleGold { fill: #9A6B00; }
      .h { font: 700 19px Arial, sans-serif; fill: #183B56; }
      .hsm { font: 700 16px Arial, sans-serif; fill: #183B56; }
      .body { font: 400 14px Arial, sans-serif; fill: #334E68; }
      .small { font: 400 12.5px Arial, sans-serif; fill: #536B7B; }
      .pill { fill: #E9F2F8; stroke: #B8D0E0; stroke-width: 1; rx: 13; }
      .pillGreen { fill: #E9F7EE; stroke: #B8DCC5; }
      .pillGold { fill: #FFF3CD; stroke: #E5C875; }
      .pillText { font: 700 12.5px Arial, sans-serif; fill: #27485B; }
      .band { fill: #17324D; rx: 18; filter: url(#shadow); }
      .bandTitle { font: 700 19px Arial, sans-serif; fill: #FFFFFF; }
      .node { fill: #20405C; stroke: #335975; stroke-width: 1.5; rx: 14; }
      .nodeGreen { fill: #1E4A3A; stroke: #2F6F54; }
      .nodeGold { fill: #4A3C18; stroke: #9A6B00; }
      .nodeTitle { font: 700 15.5px Arial, sans-serif; fill: #FFFFFF; }
      .nodeText { font: 400 12px Arial, sans-serif; fill: #C9DCEA; }
      .arrowDark { fill: none; stroke: #9EC7DA; stroke-width: 3; marker-end: url(#arrowLight); }
      .chip { fill: #21496B; rx: 13; }
      .chipText { font: 700 13px Arial, sans-serif; fill: #EAF3FA; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="1050"/>
  <rect class="header" x="0" y="0" width="1600" height="150"/>
  <text class="title" x="70" y="72">Mirabel API: Management &amp; Workflow Platform</text>
  <text class="subtitle" x="72" y="110">A control plane that turns CRM data into governed REST/GraphQL APIs and visual workflows &#8212; with enterprise auth, AI schema intelligence, and a hybrid data tier.</text>
  <text class="meta" x="1300" y="58">Portfolio artifact</text>
  <text class="meta" x="1300" y="84">React / Express / Apollo</text>

  <!-- Section A: request path -->
  <text class="phaseLabel" x="70" y="193">Request path &#183; consumers to data</text>
  <line class="phaseRule" x1="70" y1="206" x2="600" y2="206"/>

  <g transform="translate(70,222)">
    <rect class="band" width="1460" height="160"/>

    <!-- Node 1 Consumers -->
    <g transform="translate(28,28)">
      <rect class="node" width="250" height="104"/>
      <text class="nodeTitle" x="18" y="34">Consumers</text>
      <text class="nodeText" x="18" y="58">Web app, customer</text>
      <text class="nodeText" x="18" y="77">integrations, AI</text>
      <text class="nodeText" x="18" y="96">assistants &amp; MCP.</text>
    </g>
    <path class="arrowDark" d="M 282 80 C 298 80, 304 80, 320 80"/>

    <!-- Node 2 Auth -->
    <g transform="translate(324,28)">
      <rect class="nodeGold" width="250" height="104"/>
      <text class="nodeTitle" x="18" y="34">Auth &amp; Security</text>
      <text class="nodeText" x="18" y="58">JWT + 2FA, RBAC,</text>
      <text class="nodeText" x="18" y="77">rate limits, 28+</text>
      <text class="nodeText" x="18" y="96">middleware layers.</text>
    </g>
    <path class="arrowDark" d="M 578 80 C 594 80, 600 80, 616 80"/>

    <!-- Node 3 API layer -->
    <g transform="translate(620,28)">
      <rect class="nodeGreen" width="280" height="104"/>
      <text class="nodeTitle" x="18" y="34">API Layer</text>
      <text class="nodeText" x="18" y="58">REST v1/v2 (45+ modules)</text>
      <text class="nodeText" x="18" y="77">+ GraphQL via Apollo</text>
      <text class="nodeText" x="18" y="96">with DataLoader.</text>
    </g>
    <path class="arrowDark" d="M 904 80 C 920 80, 926 80, 942 80"/>

    <!-- Node 4 Services -->
    <g transform="translate(946,28)">
      <rect class="node" width="210" height="104"/>
      <text class="nodeTitle" x="18" y="34">Services</text>
      <text class="nodeText" x="18" y="58">Workflows, schema</text>
      <text class="nodeText" x="18" y="77">sync, notifications,</text>
      <text class="nodeText" x="18" y="96">job queue.</text>
    </g>
    <path class="arrowDark" d="M 1160 80 C 1176 80, 1182 80, 1198 80"/>

    <!-- Node 5 Data -->
    <g transform="translate(1202,28)">
      <rect class="nodeGold" width="230" height="104"/>
      <text class="nodeTitle" x="18" y="34">Hybrid Data</text>
      <text class="nodeText" x="18" y="58">MongoDB app state</text>
      <text class="nodeText" x="18" y="77">+ SQL Server</text>
      <text class="nodeText" x="18" y="96"> procs.</text>
    </g>
  </g>

  <!-- Section B: capabilities -->
  <text class="phaseLabel" x="70" y="437">Platform capabilities</text>
  <line class="phaseRule" x1="70" y1="450" x2="600" y2="450"/>

  <!-- Capability row 1 -->
  <g transform="translate(70,466)">
    <rect class="card cardBlue" width="440" height="158"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">1</text>
    <text class="h" x="56" y="36">API Management</text>
    <text class="body" x="22" y="72">Create, document, and rate-limit</text>
    <text class="body" x="22" y="94">endpoints with key auth and</text>
    <text class="body" x="22" y="116">self-service discovery; versioned</text>
    <text class="body" x="22" y="138">Public API Library for provisioning.</text>
  </g>
  <g transform="translate(580,466)">
    <rect class="card cardGreen" width="440" height="158"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">2</text>
    <text class="h" x="56" y="36">Visual Workflow Builder</text>
    <text class="body" x="22" y="72">A ReactFlow canvas with 15+ node</text>
    <text class="body" x="22" y="94">types &#8212; HTTP calls, scheduling,</text>
    <text class="body" x="22" y="116">branching, and approval gates &#8212;</text>
    <text class="body" x="22" y="138">with execution insights.</text>
  </g>
  <g transform="translate(1090,466)">
    <rect class="card cardGold" width="440" height="158"/>
    <circle class="numCircleGold" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">3</text>
    <text class="h" x="56" y="36">Schema Intelligence (AI)</text>
    <text class="body" x="22" y="72">Analyzes stored procedures for</text>
    <text class="body" x="22" y="94">operation type, affected tables, and</text>
    <text class="body" x="22" y="116">error handling, then generates</text>
    <text class="body" x="22" y="138">OpenAPI docs and example responses.</text>
  </g>

  <!-- Capability row 2 -->
  <g transform="translate(70,646)">
    <rect class="card cardGold" width="440" height="158"/>
    <circle class="numCircleGold" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">4</text>
    <text class="h" x="56" y="36">Enterprise Auth</text>
    <text class="body" x="22" y="72">JWT with 2FA (OTP), trusted devices,</text>
    <text class="body" x="22" y="94">role-based access control, and</text>
    <text class="body" x="22" y="116">multi-tenant isolation across the</text>
    <text class="body" x="22" y="138">whole platform.</text>
  </g>
  <g transform="translate(580,646)">
    <rect class="card cardBlue" width="440" height="158"/>
    <circle class="numCircle" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">5</text>
    <text class="h" x="56" y="36">Integrations</text>
    <text class="body" x="22" y="66">Connects out to common systems:</text>
    <rect class="pill" x="22" y="78" width="124" height="28"/><text class="pillText" x="38" y="97">ZoomInfo</text>
    <rect class="pill" x="154" y="78" width="120" height="28"/><text class="pillText" x="170" y="97">Salesforce</text>
    <rect class="pill" x="282" y="78" width="110" height="28"/><text class="pillText" x="298" y="97">HubSpot</text>
    <rect class="pill" x="22" y="112" width="90" height="28"/><text class="pillText" x="38" y="131">JIRA</text>
    <rect class="pill" x="120" y="112" width="100" height="28"/><text class="pillText" x="136" y="131">GitHub</text>
    <rect class="pill" x="228" y="112" width="160" height="28"/><text class="pillText" x="244" y="131">S3 / SFTP files</text>
  </g>
  <g transform="translate(1090,646)">
    <rect class="card cardGreen" width="440" height="158"/>
    <circle class="numCircleGreen" cx="28" cy="30" r="16"/><text class="num" x="24" y="35">6</text>
    <text class="h" x="56" y="36">AI Assistant &amp; MCP</text>
    <text class="body" x="22" y="72">Natural-language query generation</text>
    <text class="body" x="22" y="94">over stored procedures, plus a</text>
    <text class="body" x="22" y="116">Model Context Protocol server so AI</text>
    <text class="body" x="22" y="138">assistants can drive the platform.</text>
  </g>

  <!-- Section C: infra chips -->
  <g transform="translate(70,828)">
    <rect class="card cardBlue" width="1460" height="150"/>
    <text class="hsm" x="24" y="40">Architecture &amp; operations</text>
    <rect class="pill" x="24" y="56" width="210" height="34"/><text class="pillText" x="40" y="78">React 18 + Material-UI</text>
    <rect class="pill" x="248" y="56" width="240" height="34"/><text class="pillText" x="264" y="78">Express + Apollo GraphQL</text>
    <rect class="pill" x="502" y="56" width="270" height="34"/><text class="pillText" x="518" y="78">Mongoose + Prisma (SQL Server)</text>
    <rect class="pill" x="786" y="56" width="200" height="34"/><text class="pillText" x="802" y="78">Bull / Redis job queue</text>
    <rect class="pill" x="1000" y="56" width="160" height="34"/><text class="pillText" x="1016" y="78">AWS S3 storage</text>
    <rect class="pill pillGreen" x="1174" y="56" width="170" height="34"/><text class="pillText" x="1190" y="78">PM2 deployment</text>
    <text class="small" x="24" y="124">Auto-generated Swagger docs, API activity logs, audit trails, and an AI acceptance-criteria generator round out the developer experience.</text>
  </g>
</svg>
